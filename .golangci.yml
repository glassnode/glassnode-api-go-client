version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        # Retry jitter does not need cryptographic randomness.
        - G404
    errorlint:
      # errors.Is on io.EOF and context errors is idiomatic for sentinel errors.
      comparison: false
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, errcheck, unparam]
      - path: examples/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
